name: Build MSI (validation only)

# Manual validation build: uploads an unsigned artifact, never publishes a
# GitHub Release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          # Validation builds are not tag-driven; use the CMakeLists version.
          $line = (Select-String -Path CMakeLists.txt -Pattern 'project\([^)]*VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1)
          $v = $line.Matches[0].Groups[1].Value
          echo "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # vcpkg's own binary cache: built packages are zipped here and reused,
      # so FFmpeg / SDL2 / OpenSSL are only compiled when their versions change.
      - name: Prepare vcpkg binary cache
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vcpkg-bincache'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          echo "VCPKG_DEFAULT_BINARY_CACHE=$dir" >> $env:GITHUB_ENV

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-

      - name: Install vcpkg + dependencies
        shell: pwsh
        run: |
          # Try preinstalled vcpkg on the runner image first.
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          $usable = $vcpkgRoot -and (Test-Path (Join-Path $vcpkgRoot 'vcpkg.exe'))
          if (-not $usable) {
            $vcpkgRoot = Join-Path $env:USERPROFILE 'vcpkg-1pm'
            $bin = Join-Path $vcpkgRoot 'vcpkg.exe'
            if (-not (Test-Path $bin)) {
              if (Test-Path $vcpkgRoot) {
                Write-Host "Cleaning stale $vcpkgRoot"
                cmd /c "rmdir /s /q `"$vcpkgRoot`""
              }
              git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkgRoot
              if ($LASTEXITCODE -ne 0) { throw "git clone vcpkg failed" }
              $bootstrap = Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat'
              if (-not (Test-Path $bootstrap)) { throw "bootstrap-vcpkg.bat missing at $bootstrap" }
              & $bootstrap -disableMetrics
              if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
            }
          }
          Write-Host "Using vcpkg at $vcpkgRoot"
          & (Join-Path $vcpkgRoot 'vcpkg.exe') install `
            "ffmpeg[avcodec,avformat,avfilter,swscale,swresample,gpl,x264]:x64-windows" `
            "sdl2:x64-windows" `
            "openssl:x64-windows" `
            --recurse
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }
          echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV

      - name: Install WiX 5 toolset + extensions
        shell: pwsh
        run: |
          # Ensure nuget.org is a configured source for this runner user
          $sources = dotnet nuget list source 2>&1
          if ($sources -notmatch 'nuget\.org') {
            dotnet nuget add source https://api.nuget.org/v3/index.json -n nuget.org
          }
          dotnet tool install --global wix --version 5.0.2
          # Add the global tools dir to PATH for subsequent steps
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix --version
          wix extension add -g WixToolset.Firewall.wixext/5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
          wix extension list -g

      - name: Build MSI
        shell: pwsh
        run: |
          .\package.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: MCP self-test
        shell: pwsh
        run: |
          $p = Start-Process dist\stage\PhoneMimi.exe -ArgumentList '--mcp-self-test' -Wait -PassThru -NoNewWindow -RedirectStandardOutput mcp.txt
          Get-Content mcp.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Compute SHA256 (unsigned CI build)
        id: hash
        shell: pwsh
        run: |
          $msi = "dist\PhoneMimi-${{ steps.ver.outputs.version }}-win64.msi"
          $h = (Get-FileHash $msi -Algorithm SHA256).Hash
          echo "sha256=$h" >> $env:GITHUB_OUTPUT
          Write-Host "SHA256 (unsigned CI build, NOT for release): $h"

      - name: Upload MSI artifact (unsigned, validation only)
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMimi-${{ steps.ver.outputs.version }}-win64-msi-unsigned
          path: dist/PhoneMimi-${{ steps.ver.outputs.version }}-win64.msi
          retention-days: 14

      - name: Upload setup.exe artifact (unsigned, validation only)
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMimi-${{ steps.ver.outputs.version }}-win64-setup-unsigned
          path: dist/PhoneMimi-${{ steps.ver.outputs.version }}-win64-setup.exe
          retention-days: 14

      - name: Upload portable folder (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMimi-${{ steps.ver.outputs.version }}-win64-portable
          path: dist/stage
          retention-days: 14
